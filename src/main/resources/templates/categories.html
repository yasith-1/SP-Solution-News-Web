<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>News Portal — Categories</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header class="site-header">
    <div class="container">
        <h1 class="brand">📰 News Portal</h1>
        <p class="tagline">Choose a category to read the latest headlines</p>
    </div>
</header>

<main class="container">
    <h2 class="section-title">All Categories</h2>

    <div th:if="${categories.isEmpty()}" class="empty">
        No categories available yet.
    </div>

    <div class="card-grid">
        <a th:each="category : ${categories}"
           th:href="@{/categories/{id}(id=${category.id})}"
           class="category-card">
            <span class="category-name" th:text="${category.name}">Category</span>
            <span class="arrow">→</span>
        </a>
    </div>
</main>

<footer class="site-footer">
    <div class="container">SP Solutions — News Web</div>
</footer>
</body>
</html>
