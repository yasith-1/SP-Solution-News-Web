spring.application.name=news-web-sp-solution

# ---- MySQL datasource ----
# Create the database first:  CREATE DATABASE newsdb;
# Adjust username/password to match your local MySQL server.
spring.datasource.url=jdbc:mysql://localhost:3306/newsdb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Yasith@1.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Keep the persistence context open during view rendering so Thymeleaf can
# traverse lazy associations (news.categories, news.comments) safely.
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

server.port=8080

# ---- Logging (SLF4J over Logback) ----
logging.level.root=INFO
logging.level.com.spsolutions.newsweb=DEBUG
# Quieten noisy framework SQL binding logs; flip to DEBUG when needed.
logging.level.org.hibernate.SQL=INFO
# Write to a rolling file in addition to the console.
logging.file.name=logs/news-web.log
logging.logback.rollingpolicy.file-name-pattern=logs/news-web-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
